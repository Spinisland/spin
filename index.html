<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   SPIN ISLAND 3D
   ===================================================== */

let scene;
let camera;
let renderer;
let clock;

let gameStarted = false;
let gameOver = false;

const keys = {};

const mouse = {
    down: false
};

let player;
let enemies = [];
let bullets = [];
let buildings = [];
let trees = [];
let rocks = [];

let kills = 0;

const WORLD_SIZE = 2200;


/* =====================================================
   PLAYER DATA
   ===================================================== */

const playerData = {

    health: 100,

    armor: 100,

    speed: 6,

    sprintSpeed: 10,

    ammo: 30,

    reserve: 120,

    shooting: false,

    shootCooldown: 0,

    reload: false,

    yaw: 0,

    pitch: 0

};


/* =====================================================
   ZONE
   ===================================================== */

const zone = {

    radius: 850,

    minimum: 120,

    shrinkSpeed: 0.08,

    centerX: 0,

    centerZ: 0,

    ring: null

};


/* =====================================================
   INPUT
   ===================================================== */

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "r") {

        reload();

    }

});

document.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});

document.addEventListener("mousedown", e => {

    if (e.button === 0) {

        mouse.down = true;

    }

});

document.addEventListener("mouseup", e => {

    if (e.button === 0) {

        mouse.down = false;

    }

});


/* =====================================================
   START
   ===================================================== */

document.getElementById("startButton").onclick = () => {

    document.getElementById("menu").style.display = "none";

    startGame();

};


/* =====================================================
   CREATE SCENE
   ===================================================== */

function startGame() {

    gameStarted = true;

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87b7d9);

    scene.fog = new THREE.Fog(
        0x87b7d9,
        500,
        1900
    );


    camera = new THREE.PerspectiveCamera(
        70,
        innerWidth / innerHeight,
        0.1,
        3000
    );


    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(renderer.domElement);


    clock = new THREE.Clock();


    createLights();

    createIsland();

    createMountains();

    createRoads();

    createBuildings();

    createTrees();

    createRocks();

    createPlayer();

    createEnemies();

    createZone();

    updateHUD();

    animate();

}


/* =====================================================
   LIGHTS
   ===================================================== */

function createLights() {

    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    sun.position.set(
        500,
        900,
        400
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    scene.add(sun);


    const ambient =
        new THREE.HemisphereLight(
            0xbde5ff,
            0x36502e,
            1.3
        );

    scene.add(ambient);

}


/* =====================================================
   ISLAND
   ===================================================== */

function createIsland() {

    const geometry =
        new THREE.PlaneGeometry(
            WORLD_SIZE,
            WORLD_SIZE,
            80,
            80
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x668f4d,
            roughness: 1
        });


    const ground =
        new THREE.Mesh(
            geometry,
            material
        );

    ground.rotation.x = -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);


    /* Water */

    const waterGeometry =
        new THREE.PlaneGeometry(
            5000,
            5000
        );

    const waterMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x397f9c,
            roughness: .5,
            metalness: .1
        });


    const water =
        new THREE.Mesh(
            waterGeometry,
            waterMaterial
        );

    water.rotation.x =
        -Math.PI / 2;

    water.position.y = -8;

    scene.add(water);

}


/* =====================================================
   MOUNTAINS
   ===================================================== */

function createMountains() {

    for (let i = 0; i < 35; i++) {

        const height =
            80 + Math.random() * 180;

        const radius =
            70 + Math.random() * 100;


        const geometry =
            new THREE.ConeGeometry(
                radius,
                height,
                7
            );

        const material =
            new THREE.MeshStandardMaterial({
                color: 0x506b43
            });


        const mountain =
            new THREE.Mesh(
                geometry,
                material
            );


        const angle =
            Math.random() *
            Math.PI * 2;


        const distance =
            850 + Math.random() * 350;


        mountain.position.set(

            Math.cos(angle) * distance,

            height / 2 - 3,

            Math.sin(angle) * distance

        );


        mountain.castShadow = true;

        mountain.receiveShadow = true;

        scene.add(mountain);

    }

}


/* =====================================================
   ROADS
   ===================================================== */

function createRoads() {

    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x8e8068
        });


    for (let i = -800; i <= 800; i += 400) {

        const road =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    WORLD_SIZE,
                    0.5,
                    35
                ),
                roadMaterial
            );

        road.position.set(
            0,
            .3,
            i
        );

        scene.add(road);


        const road2 =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    35,
                    .5,
                    WORLD_SIZE
                ),
                roadMaterial
            );

        road2.position.set(
            i,
            .31,
            0
        );

        scene.add(road2);

    }

}


/* =====================================================
   BUILDINGS
   ===================================================== */

function createBuildings() {

    for (let i = 0; i < 65; i++) {

        const width =
            30 + Math.random() * 60;

        const depth =
            30 + Math.random() * 60;

        const height =
            15 + Math.random() * 35;


        const geometry =
            new THREE.BoxGeometry(
                width,
                height,
                depth
            );


        const material =
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color(
                        0.25 + Math.random() * .2,
                        0.22 + Math.random() * .18,
                        0.17 + Math.random() * .15
                    )
            });


        const building =
            new THREE.Mesh(
                geometry,
                material
            );


        building.position.set(

            (Math.random() - .5) *
            1700,

            height / 2,

            (Math.random() - .5) *
            1700

        );


        building.castShadow = true;

        building.receiveShadow = true;

        scene.add(building);

        buildings.push(building);

    }

}


/* =====================================================
   TREES
   ===================================================== */

function createTrees() {

    for (let i = 0; i < 350; i++) {

        const group =
            new THREE.Group();


        const trunk =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    2,
                    3,
                    15,
                    8
                ),

                new THREE.MeshStandardMaterial({
                    color: 0x5a3925
                })

            );


        trunk.position.y = 7;

        group.add(trunk);


        const leaves =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    13,
                    35,
                    8
                ),

                new THREE.MeshStandardMaterial({
                    color: 0x285d31
                })

            );


        leaves.position.y = 28;

        group.add(leaves);


        group.position.set(

            (Math.random() - .5) *
            2000,

            0,

            (Math.random() - .5) *
            2000

        );


        group.traverse(obj => {

            obj.castShadow = true;

        });


        scene.add(group);

        trees.push(group);

    }

}


/* =====================================================
   ROCKS
   ===================================================== */

function createRocks() {

    for (let i = 0; i < 130; i++) {

        const size =
            4 + Math.random() * 12;


        const rock =
            new THREE.Mesh(

                new THREE.DodecahedronGeometry(
                    size,
                    0
                ),

                new THREE.MeshStandardMaterial({
                    color: 0x77746c
                })

            );


        rock.position.set(

            (Math.random() - .5) *
            2000,

            size / 2,

            (Math.random() - .5) *
            2000

        );


        rock.rotation.y =
            Math.random() * 6;


        rock.castShadow = true;

        scene.add(rock);

        rocks.push(rock);

    }

}


/* =====================================================
   CHARACTER CREATOR
   ===================================================== */

function makeCharacter(color) {

    const character =
        new THREE.Group();


    /* Body */

    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                6,
                12,
                4,
                8
            ),

            new THREE.MeshStandardMaterial({
                color: color
            })

        );

    body.position.y = 14;

    body.castShadow = true;

    character.add(body);


    /* Head */

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                6,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({
                color: 0xd8a77d
            })

        );


    head.position.y = 28;

    head.castShadow = true;

    character.add(head);


    /* Helmet */

    const helmet =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                6.5,
                16,
                16,
                0,
                Math.PI * 2,
                0,
                Math.PI / 2
            ),

            new THREE.MeshStandardMaterial({
                color: 0x26352b
            })

        );


    helmet.position.y = 29;

    character.add(helmet);


    /* Gun */

    const gun =
        new THREE.Group();


    const gunBody =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                4,
                3,
                18
            ),

            new THREE.MeshStandardMaterial({
                color: 0x202020
            })

        );


    gun.add(gunBody);


    const barrel =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                1.2,
                1.2,
                18,
                10
            ),

            new THREE.MeshStandardMaterial({
                color: 0x111111
            })

        );


    barrel.rotation.x =
        Math.PI / 2;

    barrel.position.z = -13;

    gun.add(barrel);


    gun.position.set(
        8,
        17,
        -7
    );


    character.add(gun);


    character.userData.gun = gun;

    character.userData.body = body;

    return character;

}


/* =====================================================
   PLAYER
   ===================================================== */

function createPlayer() {

    player =
        makeCharacter(0xe0b936);

    player.position.set(
        0,
        0,
        0
    );

    scene.add(player);


    camera.position.set(
        0,
        55,
        95
    );

}


/* =====================================================
   ENEMIES
   ===================================================== */

function createEnemies() {

    for (let i = 0; i < 12; i++) {

        const enemy =
            makeCharacter(0xb84444);


        const angle =
            Math.random() *
            Math.PI * 2;


        const distance =
            250 +
            Math.random() * 700;


        enemy.position.set(

            Math.cos(angle) * distance,

            0,

            Math.sin(angle) * distance

        );


        enemy.userData.health = 100;

        enemy.userData.alive = true;

        enemy.userData.shootTimer =
            80 + Math.random() * 120;

        enemy.userData.speed =
            1.2 + Math.random() * 1.2;

        enemy.userData.angle = 0;


        scene.add(enemy);

        enemies.push(enemy);

    }

}


/* =====================================================
   ZONE
   ===================================================== */

function createZone() {

    const geometry =
        new THREE.RingGeometry(
            zone.radius - 3,
            zone.radius,
            128
        );


    const material =
        new THREE.MeshBasicMaterial({
            color: 0x66ddff,
            transparent: true,
            opacity: .85,
            side: THREE.DoubleSide
        });


    zone.ring =
        new THREE.Mesh(
            geometry,
            material
        );


    zone.ring.rotation.x =
        -Math.PI / 2;


    zone.ring.position.y = 3;

    scene.add(zone.ring);

}


/* =====================================================
   PLAYER MOVEMENT
   ===================================================== */

function movePlayer(delta) {

    let forward = 0;
    let side = 0;


    if (keys.w) forward++;
    if (keys.s) forward--;

    if (keys.a) side--;
    if (keys.d) side++;


    if (forward || side) {

        const length =
            Math.hypot(
                forward,
                side
            );


        forward /= length;
        side /= length;


        const speed =
            keys.shift ?
            playerData.sprintSpeed :
            playerData.speed;


        const direction =
            new THREE.Vector3();


        direction.set(

            Math.sin(playerData.yaw),
            0,
            Math.cos(playerData.yaw)

        );


        const right =
            new THREE.Vector3(

                Math.cos(playerData.yaw),
                0,
                -Math.sin(playerData.yaw)

            );


        player.position.addScaledVector(
            direction,
            forward * speed * delta
        );


        player.position.addScaledVector(
            right,
            side * speed * delta
        );

    }


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -1050,
            1050
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -1050,
            1050
        );

}


/* =====================================================
   CAMERA
   ===================================================== */

function updateCamera() {

    const distance = 95;

    const height = 55;


    const offset =
        new THREE.Vector3(

            Math.sin(playerData.yaw) *
            distance,

            height,

            Math.cos(playerData.yaw) *
            distance

        );


    camera.position.lerp(

        player.position
            .clone()
            .add(offset),

        .15

    );


    camera.lookAt(

        player.position.x,
        player.position.y + 18,
        player.position.z

    );

}


/* =====================================================
   SHOOTING
   ===================================================== */

function shoot() {

    if (playerData.reload)
        return;


    if (playerData.ammo <= 0) {

        reload();

        return;

    }


    const now =
        performance.now();


    if (
        now -
        playerData.shootCooldown
        <
        130
    )
        return;


    playerData.shootCooldown = now;

    playerData.ammo--;


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const start =
        player.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    20,
                    0
                )
            );


    const bullet =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.4,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color: 0xffe37a
            })

        );


    bullet.position.copy(start);

    scene.add(bullet);


    bullets.push({

        mesh: bullet,

        direction:
            direction.clone(),

        speed: 55,

        life: 80,

        enemy: false

    });


    /* muzzle flash */

    const flash =
        new THREE.PointLight(
            0xffcc55,
            5,
            50
        );


    flash.position.copy(start);

    scene.add(flash);


    setTimeout(() => {

        scene.remove(flash);

    }, 40);

}


/* =====================================================
   ENEMY SHOOT
   ===================================================== */

function enemyShoot(enemy) {

    const direction =
        player.position
            .clone()
            .sub(enemy.position);


    direction.y += 15;

    direction.normalize();


    const start =
        enemy.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    20,
                    0
                )
            );


    const bullet =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.5,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color: 0xff5555
            })

        );


    bullet.position.copy(start);

    scene.add(bullet);


    bullets.push({

        mesh: bullet,

        direction:
            direction,

        speed: 38,

        life: 100,

        enemy: true

    });

}


/* =====================================================
   BULLETS
   ===================================================== */

function updateBullets(delta) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b = bullets[i];


        b.mesh.position.addScaledVector(
            b.direction,
            b.speed * delta
        );


        b.life--;


        if (b.enemy) {

            const distance =
                b.mesh.position.distanceTo(
                    player.position
                );


            if (distance < 18) {

                damagePlayer(10);

                removeBullet(i);

                continue;

            }

        } else {

            for (const enemy of enemies) {

                if (!enemy.userData.alive)
                    continue;


                const distance =
                    b.mesh.position.distanceTo(
                        enemy.position
                    );


                if (distance < 18) {

                    enemy.userData.health -= 35;

                    removeBullet(i);


                    if (
                        enemy.userData.health <= 0
                    ) {

                        eliminateEnemy(enemy);

                    }


                    break;

                }

            }

        }


        if (b.life <= 0) {

            removeBullet(i);

        }

    }

}


function removeBullet(i) {

    scene.remove(
        bullets[i].mesh
    );

    bullets.splice(i,1);

}


/* =====================================================
   ENEMY AI
   ===================================================== */

function updateEnemies(delta) {

    for (const enemy of enemies) {

        if (!enemy.userData.alive)
            continue;


        const distance =
            enemy.position.distanceTo(
                player.position
            );


        const angle =
            Math.atan2(

                player.position.x -
                enemy.position.x,

                player.position.z -
                enemy.position.z

            );


        enemy.rotation.y = angle;


        if (distance < 650) {

            if (distance > 260) {

                enemy.position.x +=
                    Math.sin(angle) *
                    enemy.userData.speed *
                    delta *
                    12;


                enemy.position.z +=
                    Math.cos(angle) *
                    enemy.userData.speed *
                    delta *
                    12;

            }


            enemy.userData.shootTimer -=
                delta * 60;


            if (
                enemy.userData.shootTimer <= 0
            ) {

                enemyShoot(enemy);

                enemy.userData.shootTimer =
                    70 +
                    Math.random() * 100;

            }

        }


        const zoneDistance =
            Math.hypot(

                enemy.position.x,
                enemy.position.z

            );


        if (
            zoneDistance >
            zone.radius
        ) {

            enemy.userData.health -=
                .03;

        }


        if (
            enemy.userData.health <= 0
        ) {

            eliminateEnemy(enemy);

        }

    }

}


/* =====================================================
   PLAYER DAMAGE
   ===================================================== */

function damagePlayer(amount) {

    if (gameOver)
        return;


    if (playerData.armor > 0) {

        const absorbed =
            Math.min(
                playerData.armor,
                amount * .6
            );


        playerData.armor -= absorbed;

        amount -= absorbed;

    }


    playerData.health -= amount;


    if (
        playerData.health <= 0
    ) {

        playerData.health = 0;

        lose();

    }

}


/* =====================================================
   ELIMINATE ENEMY
   ===================================================== */

function eliminateEnemy(enemy) {

    if (!enemy.userData.alive)
        return;


    enemy.userData.alive = false;

    scene.remove(enemy);

    kills++;

    updateHUD();


    const remaining =
        enemies.filter(
            e => e.userData.alive
        ).length;


    if (remaining === 0) {

        win();

    }

}


/* =====================================================
   RELOAD
   ===================================================== */

function reload() {

    if (playerData.reload)
        return;

    if (
        playerData.ammo >= 30
    )
        return;

    if (
        playerData.reserve <= 0
    )
        return;


    playerData.reload = true;


    setTimeout(() => {

        const needed =
            30 -
            playerData.ammo;


        const amount =
            Math.min(
                needed,
                playerData.reserve
            );


        playerData.ammo += amount;

        playerData.reserve -= amount;

        playerData.reload = false;

        updateHUD();

    }, 1200);

}


/* =====================================================
   ZONE
   ===================================================== */

function updateZone() {

    if (
        zone.radius >
        zone.minimum
    ) {

        zone.radius -=
            zone.shrinkSpeed;

        zone.ring.scale.set(
            zone.radius / 850,
            zone.radius / 850,
            1
        );

    }


    const distance =
        Math.hypot(
            player.position.x,
            player.position.z
        );


    if (
        distance >
        zone.radius
    ) {

        damagePlayer(.04);

        document.getElementById(
            "zoneWarning"
        ).textContent =
            "⚠ YOU ARE OUTSIDE THE SAFE ZONE!";

    } else {

        document.getElementById(
            "zoneWarning"
        ).textContent =
            "SAFE ZONE: " +
            Math.round(
                zone.radius
            ) +
            "m";

    }

}


/* =====================================================
   HUD
   ===================================================== */

function updateHUD() {

    document.getElementById("hp")
        .textContent =
        Math.round(
            playerData.health
        );


    document.getElementById("armor")
        .textContent =
        Math.round(
            playerData.armor
        );


    document.getElementById("healthBar")
        .style.width =
        playerData.health + "%";


    document.getElementById("armorBar")
        .style.width =
        playerData.armor + "%";


    document.getElementById("ammo")
        .textContent =
        playerData.ammo;


    document.getElementById("reserve")
        .textContent =
        playerData.reserve;


    document.getElementById("kills")
        .textContent =
        kills;


    document.getElementById("enemies")
        .textContent =
        enemies.filter(
            e => e.userData.alive
        ).length;

}


/* =====================================================
   WIN / LOSE
   ===================================================== */

function win() {

    if (gameOver)
        return;


    gameOver = true;


    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        "🏆 SPIN CHAMPION!" +
        "<small>You are the last survivor.</small>";


    message.style.display =
        "flex";

}


function lose() {

    if (gameOver)
        return;


    gameOver = true;


    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        "GAME OVER" +
        "<small>SPIN Island got you this time.</small>";


    message.style.display =
        "flex";

}


/* =====================================================
   MAIN LOOP
   ===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (!gameStarted)
        return;


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (!gameOver) {

        movePlayer(delta);

        updateCamera();

        if (mouse.down)
            shoot();

        updateBullets(delta);

        updateEnemies(delta);

        updateZone();

        updateHUD();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
    "resize",
    () => {

        if (!camera || !renderer)
            return;


        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
