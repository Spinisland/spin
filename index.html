<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SPIN ISLAND
   ORIGINAL 3D BATTLE ROYALE PROTOTYPE
   ========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let enemies=[];
let bullets=[];
let trees=[];
let buildings=[];
let vehicles=[];
let horses=[];
let loot=[];

let gameStarted=false;
let gameOver=false;

let kills=0;

const keys={};

const mouse={
    down:false
};


/* =========================================================
   PLAYER
   ========================================================= */

const playerData={

    health:100,
    armor:100,

    speed:7,
    sprint:11,

    ammo:30,
    reserve:120,

    yaw:0,

    shooting:false,

    reload:false,

    lastShot:0,

    mounted:null

};


/* =========================================================
   WORLD
   ========================================================= */

const WORLD=2600;


/* =========================================================
   SAFE ZONE
   ========================================================= */

const zone={

    radius:1050,

    minimum:180,

    shrink:.06,

    ring:null

};


/* =========================================================
   INPUT
   ========================================================= */

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()==="r")
        reload();

    if(e.key.toLowerCase()==="e")
        mountNearby();

});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

});

addEventListener("mousedown",e=>{

    if(e.button===0)
        mouse.down=true;

});

addEventListener("mouseup",e=>{

    if(e.button===0)
        mouse.down=false;

});

addEventListener("mousemove",e=>{

    if(gameStarted){

        playerData.yaw -= e.movementX*.002;

    }

});


/* =========================================================
   START
   ========================================================= */

document.getElementById("start").onclick=()=>{

    document.getElementById("menu").style.display="none";

    startGame();

};


/* =========================================================
   START GAME
   ========================================================= */

function startGame(){

    gameStarted=true;

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x82b3cd);

    scene.fog=
        new THREE.Fog(
            0x82b3cd,
            600,
            2300
        );


    camera=new THREE.PerspectiveCamera(
        68,
        innerWidth/innerHeight,
        .1,
        4000
    );


    renderer=
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(
        renderer.domElement
    );


    clock=new THREE.Clock();


    createLights();

    createTerrain();

    createWater();

    createMountains();

    createRoads();

    createHouses();

    createTrees();

    createVehicles();

    createHorses();

    createLoot();

    createPlayer();

    createEnemies();

    createZone();

    document.body.requestPointerLock?.();

    animate();

}


/* =========================================================
   LIGHT
   ========================================================= */

function createLights(){

    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            2.2
        );

    sun.position.set(
        600,
        1000,
        400
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    scene.add(sun);


    const ambient=
        new THREE.HemisphereLight(
            0xbdeaff,
            0x385b36,
            1.2
        );

    scene.add(ambient);

}


/* =========================================================
   TERRAIN
   ========================================================= */

function createTerrain(){

    const geometry=
        new THREE.PlaneGeometry(
            WORLD,
            WORLD,
            80,
            80
        );

    const material=
        new THREE.MeshStandardMaterial({
            color:0x679451,
            roughness:1
        });


    const ground=
        new THREE.Mesh(
            geometry,
            material
        );

    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);

}


/* =========================================================
   WATER
   ========================================================= */

function createWater(){

    const geometry=
        new THREE.PlaneGeometry(
            5000,
            5000
        );

    const material=
        new THREE.MeshStandardMaterial({
            color:0x367e9e,
            roughness:.35,
            metalness:.1
        });


    const water=
        new THREE.Mesh(
            geometry,
            material
        );

    water.rotation.x=-Math.PI/2;

    water.position.y=-10;

    scene.add(water);

}


/* =========================================================
   MOUNTAINS
   ========================================================= */

function createMountains(){

    for(let i=0;i<45;i++){

        const h=
            80+
            Math.random()*220;

        const r=
            60+
            Math.random()*100;


        const mountain=
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    r,
                    h,
                    7
                ),

                new THREE.MeshStandardMaterial({
                    color:0x526e46
                })

            );


        const a=
            Math.random()*
            Math.PI*2;


        const d=
            850+
            Math.random()*450;


        mountain.position.set(

            Math.cos(a)*d,

            h/2,

            Math.sin(a)*d

        );


        mountain.castShadow=true;

        scene.add(mountain);

    }

}


/* =========================================================
   ROADS
   ========================================================= */

function createRoads(){

        new THREE.MeshStandardMaterial({
            color:0x8f8068
        });


    for(let i=-900;i<=900;i+=450){

        const horizontal=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    WORLD,
                    .4,
                    38
                ),

                mat

            );


        horizontal.position.set(
            0,
            .2,
            i
        );


        scene.add(horizontal);


        const vertical=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    38,
                    .4,
                    WORLD
                ),

                mat

            );


        vertical.position.set(
            i,
            .21,
            0
        );


        scene.add(vertical);

    }

}


/* =========================================================
   HOUSES
   ========================================================= */

function createHouses(){

    for(let i=0;i<55;i++){

        const group=
            new THREE.Group();


        const width=
            30+
            Math.random()*55;

        const depth=
            30+
            Math.random()*55;

        const height=
            20+
            Math.random()*25;


        const body=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                ),

                new THREE.MeshStandardMaterial({
                    color:
                        0x806c59
                })

        body.position.y=
            height/2;


        body.castShadow=true;

        body.receiveShadow=true;

        group.add(body);


        const roof=
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    Math.max(width,depth)*.72,

                ),

                new THREE.MeshStandardMaterial({
                    color:0x503b31
                })

            );


        roof.rotation.y=
            Math.PI/4;

        roof.position.y=
            height+10;


        roof.castShadow=true;

        group.add(roof);


        const x=
            (Math.random()-.5)*1800;

        const z=
            (Math.random()-.5)*1800;


        group.position.set(
            x,
            0,
            z
        );


        scene.add(group);

}


/* =========================================================
   TREES

/* =========================================================
   VEHICLES
   ========================================================= */

function createVehicle(){

    const car=
        new THREE.Group();


    const body=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                32,
                12,
                55
            ),

            new THREE.MeshStandardMaterial({

    cabin.position.set(

    );

   ========================================================= */

function createCharacter(color){

                14,

                10
            ),

            new THREE.MeshStandardMaterial({

            })

        );

    character.add(body);


    const head=
        new THREE.Mesh(

                6,
                18,
                18
            ),

            })

        );

    character.add(head);


    const helmet=
        new THREE.Mesh(

                16,
                16,
                0,

                0,

            ),

            })

        );


    helmet.position.y=38;

    character.add(helmet);


    const gun=
        new THREE.Group();

        new THREE.Mesh(

            ),

    );

   ========================================================= */

                ),

        scene.add(box);

        loot.push({

            mesh:box,

            taken:false

        });

    }

/* =========================================================
   SAFE ZONE
   ========================================================= */

function createZone(){

    const geometry=
        new THREE.RingGeometry(
            zone.radius-4,
            zone.radius,
            128
        );


    const material=
        new THREE.MeshBasicMaterial({
            color:0x67ddff,
            transparent:true,
            opacity:.85,
            side:THREE.DoubleSide
        });


    zone.ring=
        new THREE.Mesh(
            geometry,
            material
        );


    zone.ring.rotation.x=
        -Math.PI/2;

    zone.ring.position.y=4;

    scene.add(zone.ring);

}


/* =========================================================
   MOVEMENT
   ========================================================= */

function movePlayer(delta){

    let forward=0;
    let side=0;


    if(keys.w)forward++;
    if(keys.s)forward--;

    if(keys.a)side--;
    if(keys.d)side++;


    if(forward||side){

        const len=
            Math.hypot(
                forward,
                side
            );


        forward/=len;
        side/=len;


        let speed=
            keys.shift
            ?playerData.sprint
            :playerData.speed;


        const forwardVector=
            new THREE.Vector3(
                Math.sin(playerData.yaw),
                0,
                Math.cos(playerData.yaw)
            );


        const rightVector=
            new THREE.Vector3(
                Math.cos(playerData.yaw),
                0,
                -Math.sin(playerData.yaw)
            );


        player.position.addScaledVector(
            forwardVector,
            forward*speed*delta
        );


        player.position.addScaledVector(
            rightVector,
            side*speed*delta
        );

    }


    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -1100,
            1100
        );


    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -1100,
            1100
        );


    player.rotation.y=
        playerData.yaw;

}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

    const distance=105;

    const height=62;


    const offset=
        new THREE.Vector3(

            Math.sin(playerData.yaw)*
            distance,

            height,

            Math.cos(playerData.yaw)*
            distance

        );


    camera.position.lerp(

        player.position
            .clone()
            .add(offset),

        .12

    );


    camera.lookAt(

        player.position.x,
        player.position.y+20,
        player.position.z

    );

}


/* =========================================================
   SHOOT
   ========================================================= */

function shoot(){

    if(playerData.reload)
        return;


    if(playerData.ammo<=0){

        reload();

        return;

    }


    const now=
        performance.now();


    if(now-playerData.lastShot<120)
        return;


    playerData.lastShot=now;

    playerData.ammo--;


    const direction=
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const start=
        player.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    25,
                    0
                )
            );


    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.5,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xffe36e
            })

        );


    bullet.position.copy(start);

    scene.add(bullet);


    bullets.push({

        mesh:bullet,

        direction:direction,

        speed:65,

        life:70,

        enemy:false

    });


    gunSound();

}


/* =========================================================
   ENEMY SHOOT
   ========================================================= */

function enemyShoot(enemy){

    const direction=
        player.position
            .clone()
            .sub(enemy.position);


    direction.y+=18;

    direction.normalize();


    const start=
        enemy.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    25,
                    0
                )
            );


    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.5,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xff5555
            })

        );


    bullet.position.copy(start);

    scene.add(bullet);


    bullets.push({

        mesh:bullet,

        direction:direction,

        speed:40,

        life:100,

        enemy:true

    });

}


/* =========================================================
   BULLETS
   ========================================================= */

function updateBullets(delta){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=bullets[i];


        b.mesh.position.addScaledVector(
            b.direction,
            b.speed*delta
        );


        b.life--;


        if(b.enemy){

            if(
                b.mesh.position.distanceTo(
                    player.position
                )<20
            ){

                damagePlayer(12);

                removeBullet(i);

                continue;

            }

        }else{

            for(const enemy of enemies){

                if(!enemy.userData.alive)
                    continue;


                if(
                    b.mesh.position.distanceTo(
                        enemy.position
                    )<20
                ){

                    enemy.userData.health-=35;

                    removeBullet(i);


                    if(
                        enemy.userData.health<=0
                    ){

                        killEnemy(enemy);

                    }

                    break;

                }

            }

        }


        if(b.life<=0){

            removeBullet(i);

        }

    }

}


function removeBullet(i){

    scene.remove(
        bullets[i].mesh
    );

    bullets.splice(i,1);

}


/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemies(delta){

    for(const enemy of enemies){

        if(!enemy.userData.alive)
            continue;


        const distance=
            enemy.position.distanceTo(
                player.position
            );


        const angle=
            Math.atan2(

                player.position.x-
                enemy.position.x,

                player.position.z-
                enemy.position.z

            );


        enemy.rotation.y=angle;


        if(distance<750){

            if(distance>280){

                enemy.position.x+=
                    Math.sin(angle)*
                    enemy.userData.speed*
                    delta*
                    10;


                enemy.position.z+=
                    Math.cos(angle)*
                    enemy.userData.speed*
                    delta*
                    10;

            }


            enemy.userData.shootTimer-=delta*60;


            if(
                enemy.userData.shootTimer<=0
            ){

                enemyShoot(enemy);

                enemy.userData.shootTimer=
                    70+
                    Math.random()*120;

            }

        }


        const zoneDistance=
            Math.hypot(
                enemy.position.x,
                enemy.position.z
            );


        if(
            zoneDistance>zone.radius
        ){

            enemy.userData.health-=.04;

        }


        if(
            enemy.userData.health<=0
        ){

            killEnemy(enemy);

        }

    }

}


/* =========================================================
   DAMAGE
   ========================================================= */

function damagePlayer(amount){

    if(gameOver)
        return;


    if(playerData.armor>0){

        const absorbed=
            Math.min(
                playerData.armor,
                amount*.6
            );


        playerData.armor-=absorbed;

        amount-=absorbed;

    }


    playerData.health-=amount;


    if(playerData.health<=0){

        playerData.health=0;

        lose();

    }

}


/* =========================================================
   KILL
   ========================================================= */

function killEnemy(enemy){

    if(!enemy.userData.alive)
        return;


    enemy.userData.alive=false;

    scene.remove(enemy);

    kills++;

    hitSound();


    if(
        enemies.filter(
            e=>e.userData.alive
        ).length===0
    ){

        win();

    }

}


/* =========================================================
   LOOT PICKUP
   ========================================================= */

function pickup(){

    for(const item of loot){

        if(item.taken)
            continue;


        if(
            player.position.distanceTo(
                item.mesh.position
            )<45
        ){

            item.taken=true;

            scene.remove(
                item.mesh
            );


            playerData.reserve+=30;

            pickupSound();

            break;

        }

    }

}


/* =========================================================
   MOUNT
   ========================================================= */

function mountNearby(){

    if(playerData.mounted){

        playerData.mounted.occupied=false;

        playerData.mounted=null;

        return;

    }


    for(const vehicle of vehicles){

        if(
            player.position.distanceTo(
                vehicle.mesh.position
            )<70 &&
            !vehicle.occupied
        ){

            vehicle.occupied=true;

            playerData.mounted=vehicle;

            return;

        }

    }


    for(const horse of horses){

        if(
            player.position.distanceTo(
                horse.mesh.position
            )<60 &&
            !horse.occupied
        ){

            horse.occupied=true;

            playerData.mounted=horse;

            return;

        }

    }

}


/* =========================================================
   ZONE
   ========================================================= */

function updateZone(){

    if(
        zone.radius>zone.minimum
    ){

        zone.radius-=zone.shrink;

        const scale=
            zone.radius/1050;

        zone.ring.scale.set(
            scale,
            scale,
            1
        );

    }


    const distance=
        Math.hypot(
            player.position.x,
            player.position.z
        );


    if(
        distance>zone.radius
    ){

        damagePlayer(.06);

        document.getElementById(
            "warning"
        ).textContent=
            "⚠ OUTSIDE SAFE ZONE";

    }else{

        document.getElementById(
            "warning"
        ).textContent=
            "SAFE ZONE: "+
            Math.round(zone.radius)+
            "m";

    }

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

    document.getElementById("hp")
        .textContent=
        Math.round(playerData.health);


    document.getElementById("armor")
        .textContent=
        Math.round(playerData.armor);


    document.getElementById("healthBar")
        .style.width=
        playerData.health+"%";


    document.getElementById("armorBar")
        .style.width=
        playerData.armor+"%";


    document.getElementById("ammo")
        .textContent=
        playerData.ammo;


    document.getElementById("reserve")
        .textContent=
        playerData.reserve;


    document.getElementById("kills")
        .textContent=
        kills;


    document.getElementById("enemyCount")
        .textContent=
        enemies.filter(
            e=>e.userData.alive
        ).length;

}


/* =========================================================
   SOUND SYSTEM
   ========================================================= */

let audioContext=null;


function audio(){

    if(!audioContext){

        audioContext=
            new (
                window.AudioContext||
                window.webkitAudioContext
            )();

    }

}


function gunSound(){

    audio();

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();


    osc.type="square";

    osc.frequency.value=120;


    gain.gain.setValueAtTime(
        .18,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.09
    );


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    osc.start();

    osc.stop(
        audioContext.currentTime+.09
    );

}


function hitSound(){

    audio();

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();


    osc.type="triangle";

    osc.frequency.value=550;


    gain.gain.setValueAtTime(
        .12,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.12
    );


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    osc.start();

    osc.stop(
        audioContext.currentTime+.12
    );

}


function pickupSound(){

    audio();

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();


    osc.frequency.value=800;

    gain.gain.value=.08;


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    osc.start();

    osc.frequency.exponentialRampToValueAtTime(
        1200,
        audioContext.currentTime+.15
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.2
    );


    osc.stop(
        audioContext.currentTime+.2
    );

}


/* =========================================================
   RELOAD
   ========================================================= */

function reload(){

    if(playerData.reload)
        return;


    if(playerData.ammo>=30)
        return;


    if(playerData.reserve<=0)
        return;


    playerData.reload=true;


    setTimeout(()=>{

        const needed=
            30-playerData.ammo;


        const amount=
            Math.min(
                needed,
                playerData.reserve
            );


        playerData.ammo+=amount;

        playerData.reserve-=amount;

        playerData.reload=false;

    },1100);

}


/* =========================================================
   WIN / LOSE
   ========================================================= */

function win(){

    if(gameOver)
        return;


    gameOver=true;


    const m=
        document.getElementById(
            "message"
        );


    m.innerHTML=
        "🏆 SPIN CHAMPION!" +
        "<small>You are the last survivor.</small>";


    m.style.display="flex";

}


function lose(){

    if(gameOver)
        return;


    gameOver=true;


    const m=
        document.getElementById(
            "message"
        );


    m.innerHTML=
        "GAME OVER" +
        "<small>You were eliminated.</small>";


    m.style.display="flex";

}


/* =========================================================
   LOOP
   ========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!gameStarted)
        return;


    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(!gameOver){

        movePlayer(delta);

        updateCamera();

        if(mouse.down)
            shoot();

        updateBullets(delta);

        updateEnemies(delta);

        updateZone();

        updateHUD();

        pickup();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
   ========================================================= */

addEventListener("resize",()=>{

    if(!camera)
        return;


    camera.aspect=
        innerWidth/innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

});

</script>
