<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SPIN ISLAND
   ========================================================= */

let scene,camera,renderer,clock;

let player;
let enemies=[];
let bullets=[];
let houses=[];
let trees=[];
let cars=[];
let horses=[];
let loot=[];

let started=false;
let ended=false;
let kills=0;

const keys={};
const mouse={down:false};

const WORLD=3000;

const zone={
    radius:1200,
    minimum:220,
    speed:.045,
    ring:null
};

const playerState={
    hp:100,
    armor:100,
    ammo:30,
    reserve:120,
    weapon:"RIFLE",
    damage:30,
    fireRate:120,
    lastShot:0,
    reloading:false,
    yaw:0,
    mounted:null
};


/* =========================================================
   INPUT
   ========================================================= */

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()==="r") reload();

    if(e.key.toLowerCase()==="e") mount();

    if(e.key==="1") weapon("RIFLE");
    if(e.key==="2") weapon("SHOTGUN");
    if(e.key==="3") weapon("PISTOL");

});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

addEventListener("mousedown",e=>{
    if(e.button===0) mouse.down=true;
});

addEventListener("mouseup",e=>{
    if(e.button===0) mouse.down=false;
});

addEventListener("mousemove",e=>{
    if(started && document.pointerLockElement){
        playerState.yaw-=e.movementX*.0025;
    }
});


document.getElementById("start").onclick=()=>{
    document.getElementById("menu").style.display="none";
    document.body.requestPointerLock();
    startGame();
};


/* =========================================================
   START
   ========================================================= */

function startGame(){

    started=true;

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x86b8cf);

    scene.fog=new THREE.Fog(
        0x86b8cf,
        700,
        2600
    );

    camera=new THREE.PerspectiveCamera(
        70,
        innerWidth/innerHeight,
        .1,
        5000
    );

    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(innerWidth,innerHeight);

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(renderer.domElement);

    clock=new THREE.Clock();

    lights();
    terrain();
    river();
    mountains();
    roads();
    createHouses();
    createTrees();
    createCars();
    createHorses();
    createLoot();
    createPlayer();
    createEnemies();
    createZone();

    animate();
}


/* =========================================================
   LIGHTS
   ========================================================= */

function lights(){

    const sun=new THREE.DirectionalLight(
        0xffffff,
        2.4
    );

    sun.position.set(
        500,
        1000,
        400
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    scene.add(sun);

    scene.add(
        new THREE.HemisphereLight(
            0xbfe8ff,
            0x35552e,
            1.2
        )
    );
}


/* =========================================================
   TERRAIN
   ========================================================= */

function terrain(){

    const geo=new THREE.PlaneGeometry(
        WORLD,WORLD,100,100
    );

    const mat=new THREE.MeshStandardMaterial({
        color:0x649653,
        roughness:1
    });

    const ground=new THREE.Mesh(geo,mat);

    ground.rotation.x=-Math.PI/2;
    ground.receiveShadow=true;

    scene.add(ground);
}


/* =========================================================
   RIVER
   ========================================================= */

function river(){

    const geo=new THREE.PlaneGeometry(
        250,3100
    );

    const mat=new THREE.MeshStandardMaterial({
        color:0x2e8cac,
        roughness:.25,
        metalness:.15
    });

    const water=new THREE.Mesh(geo,mat);

    water.rotation.x=-Math.PI/2;
    water.position.y=.2;

    scene.add(water);
}


/* =========================================================
   MOUNTAINS
   ========================================================= */

function mountains(){

    for(let i=0;i<45;i++){

        const h=80+Math.random()*250;
        const r=60+Math.random()*130;

        const m=new THREE.Mesh(
            new THREE.ConeGeometry(r,h,8),
            new THREE.MeshStandardMaterial({
                color:0x4d7049
            })
        );

        const a=Math.random()*Math.PI*2;
        const d=1050+Math.random()*500;

        m.position.set(
            Math.cos(a)*d,
            h/2,
            Math.sin(a)*d
        );

        m.castShadow=true;

        scene.add(m);
    }
}


/* =========================================================
   ROADS
   ========================================================= */

function roads(){

    const mat=new THREE.MeshStandardMaterial({
        color:0x938169
    });

    for(let i=-1000;i<=1000;i+=400){

        const road1=new THREE.Mesh(
            new THREE.BoxGeometry(
                WORLD,.5,32
            ),mat
        );

        road1.position.set(0,.2,i);
        scene.add(road1);

        const road2=new THREE.Mesh(
            new THREE.BoxGeometry(
                32,.5,WORLD
            ),mat
        );

        road2.position.set(i,.21,0);
        scene.add(road2);
    }
}


/* =========================================================
   HOUSE
   ========================================================= */

function house(){

    const g=new THREE.Group();

    const w=35+Math.random()*45;
    const d=35+Math.random()*45;
    const h=22+Math.random()*20;

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color:0x806c58
        })
    );

    body.position.y=h/2;
    body.castShadow=true;
    body.receiveShadow=true;

    g.add(body);

    const roof=new THREE.Mesh(
        new THREE.ConeGeometry(
            Math.max(w,d)*.7,
            22,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0x4c3830
        })
    );

    roof.rotation.y=Math.PI/4;
    roof.position.y=h+11;

    roof.castShadow=true;

    g.add(roof);

    return g;
}


function createHouses(){

    for(let i=0;i<60;i++){

        const h=house();

        h.position.set(
            (Math.random()-.5)*2300,
            0,
            (Math.random()-.5)*2300
        );

        scene.add(h);
        houses.push(h);
    }
}


/* =========================================================
   TREES
   ========================================================= */

function tree(){

    const g=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            2,3,18,8
        ),
        new THREE.MeshStandardMaterial({
            color:0x573b27
        })
    );

    trunk.position.y=9;

    g.add(trunk);

    const crown=new THREE.Mesh(
        new THREE.ConeGeometry(
            16,45,9
        ),
        new THREE.MeshStandardMaterial({
            color:0x285d32
        })
    );

    crown.position.y=37;
    crown.castShadow=true;

    g.add(crown);

    return g;
}


function createTrees(){

    for(let i=0;i<550;i++){

        const t=tree();

        t.position.set(
            (Math.random()-.5)*2700,
            0,
            (Math.random()-.5)*2700
        );

        scene.add(t);
        trees.push(t);
    }
}


/* =========================================================
   VEHICLES
   ========================================================= */

function vehicle(){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            34,13,58
        ),
        new THREE.MeshStandardMaterial({
            color:0x30383b
        })
    );

    body.position.y=13;
    body.castShadow=true;

    g.add(body);

    const cabin=new THREE.Mesh(
        new THREE.BoxGeometry(
            27,15,28
        ),
        new THREE.MeshStandardMaterial({
            color:0x182126
        })
    );

    cabin.position.set(0,26,-3);

    g.add(cabin);

    for(const x of [-18,18]){
        for(const z of [-19,19]){

            const wheel=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    7,7,5,16
                ),
                new THREE.MeshStandardMaterial({
                    color:0x111111
                })
            );

            wheel.rotation.z=Math.PI/2;

            wheel.position.set(
                x,8,z
            );

            g.add(wheel);
        }
    }

    return g;
}


function createCars(){

    for(let i=0;i<9;i++){

        const car=vehicle();

        car.position.set(
            (Math.random()-.5)*2100,
            0,
            (Math.random()-.5)*2100
        );

        scene.add(car);

        cars.push({
            mesh:car,
            occupied:false
        });
    }
}


/* =========================================================
   HORSE
   ========================================================= */

function horse(){

    const g=new THREE.Group();

    const brown=new THREE.MeshStandardMaterial({
        color:0x75482f
    });

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            18,13,35
        ),brown
    );

    body.position.y=20;
    g.add(body);

    const neck=new THREE.Mesh(
        new THREE.BoxGeometry(
            9,24,11
        ),brown
    );

    neck.position.set(
        0,32,-13
    );

    neck.rotation.x=-.2;

    g.add(neck);

    const head=new THREE.Mesh(
        new THREE.BoxGeometry(
            10,10,16
        ),brown
    );

    head.position.set(
        0,43,-20
    );

    g.add(head);

    for(const x of [-6,6]){
        for(const z of [-11,11]){

            const leg=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    2,2,20,8
                ),brown
            );

            leg.position.set(
                x,10,z
            );

            g.add(leg);
        }
    }

    return g;
}


function createHorses(){

    for(let i=0;i<6;i++){

        const h=horse();

        h.position.set(
            (Math.random()-.5)*2200,
            0,
            (Math.random()-.5)*2200
        );

        scene.add(h);

        horses.push({
            mesh:h,
            occupied:false
        });
    }
}


/* =========================================================
   CHARACTER
   ========================================================= */

function character(bodyColor){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            6,15,6,12
        ),
        new THREE.MeshStandardMaterial({
            color:bodyColor
        })
    );

    body.position.y=19;
    body.castShadow=true;

    g.add(body);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            6,20,20
        ),
        new THREE.MeshStandardMaterial({
            color:0xc98d67
        })
    );

    head.position.y=37;
    head.castShadow=true;

    g.add(head);

    const helmet=new THREE.Mesh(
        new THREE.SphereGeometry(
            6.6,18,18,0,
            Math.PI*2,0,Math.PI/2
        ),
        new THREE.MeshStandardMaterial({
            color:0x27362d
        })
    );

    helmet.position.y=39;

    g.add(helmet);

    const gun=new THREE.Group();

    const gunBody=new THREE.Mesh(
        new THREE.BoxGeometry(
            4,4,25
        ),
        new THREE.MeshStandardMaterial({
            color:0x171717
        })
    );

    gun.add(gunBody);

    const barrel=new THREE.Mesh(
        new THREE.CylinderGeometry(
            1.2,1.2,18,10
        ),
        new THREE.MeshStandardMaterial({
            color:0x080808
        })
    );

    barrel.rotation.x=Math.PI/2;
    barrel.position.z=-20;

    gun.add(barrel);

    gun.position.set(
        8,22,-10
    );

    g.add(gun);

    g.userData.gun=gun;

    return g;
}


/* =========================================================
   PLAYER
   ========================================================= */

function createPlayer(){

    player=character(0xd9b936);

    player.position.set(0,0,0);

    scene.add(player);
}


/* =========================================================
   ENEMIES
   ========================================================= */

function createEnemies(){

    for(let i=0;i<12;i++){

        const e=character(0xb94747);

        const angle=Math.random()*Math.PI*2;
        const distance=450+Math.random()*850;

        e.position.set(
            Math.cos(angle)*distance,
            0,
            Math.sin(angle)*distance
        );

        e.userData.hp=100;
        e.userData.alive=true;
        e.userData.speed=1.5+Math.random()*1.5;
        e.userData.timer=50+Math.random()*120;

        scene.add(e);
        enemies.push(e);
    }
}


/* =========================================================
   LOOT
   ========================================================= */

function createLoot(){

    for(let i=0;i<90;i++){

        const box=new THREE.Mesh(
            new THREE.BoxGeometry(
                11,11,11
            ),
            new THREE.MeshStandardMaterial({
                color:Math.random()<.5
                    ?0xe2b938
                    :0x3dc866
            })
        );

        box.position.set(
            (Math.random()-.5)*2300,
            6,
            (Math.random()-.5)*2300
        );

        box.castShadow=true;

        scene.add(box);

        loot.push({
            mesh:box,
            taken:false
        });
    }
}


/* =========================================================
   ZONE
   ========================================================= */

function createZone(){

    const geo=new THREE.RingGeometry(
        zone.radius-5,
        zone.radius,
        128
    );

    const mat=new THREE.MeshBasicMaterial({
        color:0x5edcff,
        transparent:true,
        opacity:.9,
        side:THREE.DoubleSide
    });

    zone.ring=new THREE.Mesh(
        geo,mat
    );

    zone.ring.rotation.x=-Math.PI/2;
    zone.ring.position.y=5;

    scene.add(zone.ring);
}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function movePlayer(delta){

    if(playerState.mounted){

        player.position.copy(
            playerState.mounted.mesh.position
        );

        return;
    }

    let f=0;
    let s=0;

    if(keys.w)f++;
    if(keys.s)f--;
    if(keys.a)s--;
    if(keys.d)s++;

    if(!f&&!s)return;

    const length=Math.hypot(f,s);

    f/=length;
    s/=length;

    const speed=
        keys.shift ? 12 : 7;

    const forward=new THREE.Vector3(
        Math.sin(playerState.yaw),
        0,
        Math.cos(playerState.yaw)
    );

    const right=new THREE.Vector3(
        Math.cos(playerState.yaw),
        0,
        -Math.sin(playerState.yaw)
    );

    player.position.addScaledVector(
        forward,
        f*speed*delta
    );

    player.position.addScaledVector(
        right,
        s*speed*delta
    );

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -1350,1350
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -1350,1350
        );

    player.rotation.y=
        playerState.yaw;
}


/* =========================================================
   CAMERA
   ========================================================= */

function cameraUpdate(){

    const distance=105;
    const height=60;

    const offset=new THREE.Vector3(
        Math.sin(playerState.yaw)*distance,
        height,
        Math.cos(playerState.yaw)*distance
    );

    const target=
        player.position.clone().add(offset);

    camera.position.lerp(target,.12);

    camera.lookAt(
        player.position.x,
        player.position.y+22,
        player.position.z
    );
}


/* =========================================================
   WEAPONS
   ========================================================= */

function weapon(name){

    playerState.weapon=name;

    if(name==="RIFLE"){
        playerState.damage=30;
        playerState.fireRate=120;
    }

    if(name==="SHOTGUN"){
        playerState.damage=65;
        playerState.fireRate=700;
    }

    if(name==="PISTOL"){
        playerState.damage=22;
        playerState.fireRate=300;
    }

    document.getElementById(
        "weapon"
    ).textContent=name;
}


/* =========================================================
   SHOOT
   ========================================================= */

function shoot(){

    if(playerState.reloading)return;

    if(playerState.ammo<=0){
        reload();
        return;
    }

    const now=performance.now();

    if(
        now-playerState.lastShot<
        playerState.fireRate
    )return;

    playerState.lastShot=now;

    playerState.ammo--;

    const direction=new THREE.Vector3();

    camera.getWorldDirection(direction);

    const start=
        player.position.clone();

    start.y+=25;

    const b=new THREE.Mesh(
        new THREE.SphereGeometry(
            1.6,8,8
        ),
        new THREE.MeshBasicMaterial({
            color:0xffe26b
        })
    );

    b.position.copy(start);

    scene.add(b);

    bullets.push({
        mesh:b,
        direction:direction,
        speed:90,
        life:65,
        enemy:false
    });

    weaponSound(playerState.weapon);
}


/* =========================================================
   ENEMY SHOOT
   ========================================================= */

function enemyShoot(enemy){

    const direction=
        player.position.clone()
        .sub(enemy.position);

    direction.y+=20;
    direction.normalize();

    const b=new THREE.Mesh(
        new THREE.SphereGeometry(
            1.4,8,8
        ),
        new THREE.MeshBasicMaterial({
            color:0xff4848
        })
    );

    b.position.copy(enemy.position);
    b.position.y+=25;

    scene.add(b);

    bullets.push({
        mesh:b,
        direction:direction,
        speed:42,
        life:100,
        enemy:true
    });

    weaponSound("ENEMY");
}


/* =========================================================
   BULLETS
   ========================================================= */

function updateBullets(delta){

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.mesh.position.addScaledVector(
            b.direction,
            b.speed*delta
        );

        b.life--;

        if(b.enemy){

            if(
                b.mesh.position.distanceTo(
                    player.position
                )<22
            ){

                damage(10);
                removeBullet(i);
                continue;
            }

        }else{

            let hit=false;

            for(const enemy of enemies){

                if(!enemy.userData.alive)
                    continue;

                if(
                    b.mesh.position.distanceTo(
                        enemy.position
                    )<22
                ){

                    enemy.userData.hp-=
                        playerState.damage;

                    removeBullet(i);

                    hit=true;

                    if(enemy.userData.hp<=0)
                        kill(enemy);

                    break;
                }
            }

            if(hit)continue;
        }

        if(b.life<=0)
            removeBullet(i);
    }
}


function removeBullet(i){

    scene.remove(
        bullets[i].mesh
    );

    bullets.splice(i,1);
}


/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemies(delta){

    for(const e of enemies){

        if(!e.userData.alive)
            continue;

        const distance=
            e.position.distanceTo(
                player.position
            );

        const angle=Math.atan2(
            player.position.x-e.position.x,
            player.position.z-e.position.z
        );

        e.rotation.y=angle;

        if(distance<850){

            if(distance>280){

                e.position.x+=
                    Math.sin(angle)*
                    e.userData.speed*
                    delta*10;

                e.position.z+=
                    Math.cos(angle)*
                    e.userData.speed*
                    delta*10;
            }

            e.userData.timer-=delta*60;

            if(e.userData.timer<=0){

                enemyShoot(e);

                e.userData.timer=
                    70+Math.random()*100;
            }
        }

        const d=Math.hypot(
            e.position.x,
            e.position.z
        );

        if(d>zone.radius)
            e.userData.hp-=.03;

        if(e.userData.hp<=0)
            kill(e);
    }
}


/* =========================================================
   DAMAGE
   ========================================================= */

function damage(amount){

    if(playerState.armor>0){

        const block=Math.min(
            playerState.armor,
            amount*.65
        );

        playerState.armor-=block;

        amount-=block;
    }

    playerState.hp-=amount;

    if(playerState.hp<=0){

        playerState.hp=0;

        lose();
    }
}


/* =========================================================
   KILL
   ========================================================= */

function kill(e){

    if(!e.userData.alive)return;

    e.userData.alive=false;

    scene.remove(e);

    kills++;

    hitSound();

    if(
        enemies.filter(
            x=>x.userData.alive
        ).length===0
    ){

        win();
    }
}


/* =========================================================
   LOOT
   ========================================================= */

function pickup(){

    for(const item of loot){

        if(item.taken)continue;

        if(
            player.position.distanceTo(
                item.mesh.position
            )<45
        ){

            item.taken=true;

            scene.remove(item.mesh);

            playerState.reserve+=30;

            pickupSound();

            break;
        }
    }
}


/* =========================================================
   MOUNT
   ========================================================= */

function mount(){

    if(playerState.mounted){

        playerState.mounted.occupied=false;

        playerState.mounted=null;

        return;
    }

    for(const c of cars){

        if(
            player.position.distanceTo(
                c.mesh.position
            )<75 &&
            !c.occupied
        ){

            c.occupied=true;
            playerState.mounted=c;

            return;
        }
    }

    for(const h of horses){

        if(
            player.position.distanceTo(
                h.mesh.position
            )<65 &&
            !h.occupied
        ){

            h.occupied=true;
            playerState.mounted=h;

            return;
        }
    }
}


/* =========================================================
   ZONE
   ========================================================= */

function updateZone(){

    if(zone.radius>zone.minimum){

        zone.radius-=zone.speed;

        const scale=
            zone.radius/1200;

        zone.ring.scale.set(
            scale,scale,1
        );
    }

    const distance=Math.hypot(
        player.position.x,
        player.position.z
    );

    if(distance>zone.radius){

        damage(.05);

        document.getElementById(
            "zone"
        ).textContent=
            "⚠ OUTSIDE SAFE ZONE";

    }else{

        document.getElementById(
            "zone"
        ).textContent=
            "SAFE ZONE • "+
            Math.round(zone.radius)+
            "m";
    }
}


/* =========================================================
   HUD
   ========================================================= */

function hud(){

    document.getElementById("hp")
        .textContent=Math.round(
            playerState.hp
        );

    document.getElementById("armor")
        .textContent=Math.round(
            playerState.armor
        );

    document.getElementById("hpbar")
        .style.width=
        playerState.hp+"%";

    document.getElementById("armorbar")
        .style.width=
        playerState.armor+"%";

    document.getElementById("ammo")
        .textContent=
        playerState.ammo;

    document.getElementById("reserve")
        .textContent=
        playerState.reserve;

    document.getElementById("kills")
        .textContent=kills;

    document.getElementById("enemies")
        .textContent=
        enemies.filter(
            e=>e.userData.alive
        ).length;
}


/* =========================================================
   SOUND
   ========================================================= */

let audioCtx=null;

function audio(){

    if(!audioCtx){

        audioCtx=
            new (
                window.AudioContext||
                window.webkitAudioContext
            )();
    }
}


function weaponSound(type){

    audio();

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    let freq=110;
    let duration=.08;

    if(type==="SHOTGUN"){
        freq=75;
        duration=.14;
    }

    if(type==="PISTOL"){
        freq=170;
        duration=.07;
    }

    o.type="sawtooth";
    o.frequency.value=freq;

    g.gain.setValueAtTime(
        .16,
        audioCtx.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();

    o.stop(
        audioCtx.currentTime+duration
    );
}


function hitSound(){

    audio();

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.type="triangle";
    o.frequency.value=600;

    g.gain.value=.12;

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();

    g.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.12
    );

    o.stop(
        audioCtx.currentTime+.12
    );
}


function pickupSound(){

    audio();

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.type="sine";
    o.frequency.value=700;

    g.gain.value=.08;

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();

    o.frequency.exponentialRampToValueAtTime(
        1100,
        audioCtx.currentTime+.15
    );

    g.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.2
    );

    o.stop(
        audioCtx.currentTime+.2
    );
}


/* =========================================================
   RELOAD
   ========================================================= */

function reload(){

    if(playerState.reloading)return;

    if(playerState.ammo>=30)return;

    if(playerState.reserve<=0)return;

    playerState.reloading=true;

    setTimeout(()=>{

        const needed=
            30-playerState.ammo;

        const amount=Math.min(
            needed,
            playerState.reserve
        );

        playerState.ammo+=amount;
        playerState.reserve-=amount;

        playerState.reloading=false;

    },1000);
}


/* =========================================================
   END
   ========================================================= */

function win(){

    if(ended)return;

    ended=true;

    const m=document.getElementById(
        "message"
    );

    m.innerHTML=
        "🏆 SPIN CHAMPION!"+
        "<small>You are the last survivor.</small>";

    m.style.display="flex";
}


function lose(){

    if(ended)return;

    ended=true;

    const m=document.getElementById(
        "message"
    );

    m.innerHTML=
        "GAME OVER"+
        "<small>You were eliminated.</small>";

    m.style.display="flex";
}


/* =========================================================
   LOOP
   ========================================================= */

function animate(){

    requestAnimationFrame(animate);

    if(!started)return;

    const delta=Math.min(
        clock.getDelta(),
        .05
    );

    if(!ended){

        movePlayer(delta);

        cameraUpdate();

        if(mouse.down)
            shoot();

        updateBullets(delta);
        updateEnemies(delta);
        updateZone();
        pickup();
        hud();
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
   ========================================================= */

addEventListener("resize",()=>{

    if(!camera)return;

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});

</script>
