<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERICK AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#212121;
    --sidebar:#171717;
    --text:#fff;
    --muted:#9b9b9b;
    --border:#343434;
    --input:#303030;
    --hover:#2a2a2a;
    --accent:#10a37f;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:var(--bg);
    color:var(--text);

    height:100vh;
    overflow:hidden;
}


/* APP */

.app{
    display:flex;
    height:100vh;
}


/* SIDEBAR */

.sidebar{
    width:270px;
    background:var(--sidebar);

    border-right:
        1px solid var(--border);

    display:flex;
    flex-direction:column;

    padding:14px;
}

.logo{
    padding:16px 12px 22px;

    font-size:21px;
    font-weight:700;

    letter-spacing:.2px;
}

.logo span{
    color:var(--accent);
}

.new-chat{
    width:100%;

    background:transparent;

    border:
        1px solid #444;

    color:white;

    padding:12px;

    border-radius:9px;

    font-size:14px;

    cursor:pointer;

    text-align:left;

    transition:.2s;
}

.new-chat:hover{
    background:var(--hover);
}

.chat-list{
    margin-top:20px;

    overflow-y:auto;

    flex:1;
}

.chat-item{
    padding:10px 12px;

    color:#ccc;

    border-radius:8px;

    font-size:14px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    cursor:pointer;
}

.chat-item:hover{
    background:var(--hover);
}

.sidebar-footer{
    border-top:
        1px solid var(--border);

    padding:14px 8px;

    color:#777;

    font-size:12px;
}


/* MAIN */

.main{
    flex:1;

    display:flex;
    flex-direction:column;

    min-width:0;
}


/* TOP BAR */

.topbar{
    height:60px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 22px;
}

.title{
    font-weight:600;
}

.online{
    color:#777;

    font-size:12px;
}


/* CHAT */

.chat{
    flex:1;

    overflow-y:auto;

    padding:
        40px
        14%;

    scroll-behavior:smooth;
}


/* WELCOME */

.welcome{
    max-width:700px;

    margin:
        15vh
        auto
        0;

    text-align:center;
}

.welcome-logo{
    width:60px;
    height:60px;

    margin:auto;

    border-radius:50%;

    background:var(--accent);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:25px;
    font-weight:bold;
}

.welcome h1{
    margin-top:22px;

    font-size:34px;
}

.welcome p{
    margin-top:10px;

    color:#999;

    font-size:15px;
}


/* MESSAGE */

.message{
    display:flex;

    gap:15px;

    margin-bottom:30px;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.avatar{
    flex-shrink:0;

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:10px;

    font-weight:bold;
}

.user-avatar{
    background:#555;
}

.ai-avatar{
    background:var(--accent);
}

.message-body{
    flex:1;

    max-width:850px;

    line-height:1.65;

    font-size:15px;

    white-space:pre-wrap;

    overflow-wrap:break-word;
}

.copy-btn{
    margin-top:9px;

    background:transparent;

    border:1px solid #444;

    color:#999;

    padding:5px 9px;

    border-radius:6px;

    font-size:11px;

    cursor:pointer;
}

.copy-btn:hover{
    color:white;
    background:#292929;
}


/* TYPING */

.typing{
    display:flex;

    gap:5px;

    padding:8px 0;
}

.dot{
    width:7px;
    height:7px;

    background:#999;

    border-radius:50%;

    animation:
        typing 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }

    30%{
        transform:translateY(-5px);
        opacity:1;
    }

}


/* INPUT AREA */

.input-area{
    padding:
        15px
        14%;

    padding-top:0;
}

.input-container{
    background:var(--input);

    border:
        1px solid #555;

    border-radius:16px;

    display:flex;

    align-items:flex-end;

    padding:8px;

    box-shadow:
        0 4px 25px
        rgba(0,0,0,.15);
}

textarea{
    flex:1;

    resize:none;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    font-family:inherit;

    font-size:15px;

    padding:12px;

    min-height:48px;

    max-height:180px;
}

textarea::placeholder{
    color:#888;
}

.send{
    width:44px;
    height:44px;

    border:none;

    border-radius:10px;

    background:white;

    color:#111;

    font-size:20px;

    cursor:pointer;

    transition:.2s;
}

.send:hover{
    transform:scale(1.04);
}

.send:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.disclaimer{
    text-align:center;

    color:#666;

    font-size:11px;

    margin-top:8px;
}


/* MOBILE */

@media(max-width:750px){

    .sidebar{
        display:none;
    }

    .chat{
        padding:25px 16px;
    }

    .input-area{
        padding:
            10px 12px;
    }

    .welcome{
        margin-top:18vh;
    }

    .welcome h1{
        font-size:28px;
    }

}

</style>
</head>


<body>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        ✦ ERICK <span>AI</span>
    </div>

    <button
        class="new-chat"
        onclick="newChat()">

        ＋ New chat

    </button>

    <div
        class="chat-list"
        id="chatList">
    </div>

    <div class="sidebar-footer">

        ERICK AI<br>
        Personal AI Assistant

    </div>

</aside>


<!-- MAIN -->

<main class="main">


<header class="topbar">

    <div class="title">
        ERICK AI
    </div>

    <div class="online">
        ● Ready
    </div>

</header>


<!-- CHAT -->

<section
    class="chat"
    id="chat">

    <div
        class="welcome"
        id="welcome">

        <div class="welcome-logo">
            E
        </div>

        <h1>
            How can I help you?
        </h1>

        <p>
            Ask ERICK AI anything.
        </p>

    </div>

</section>


<!-- INPUT -->

<div class="input-area">

    <div class="input-container">

        <textarea
            id="input"
            rows="1"
            placeholder="Message ERICK AI..."
        ></textarea>

        <button
            class="send"
            id="send">

            ↑

        </button>

    </div>

    <div class="disclaimer">
        ERICK AI is an experimental AI assistant.
    </div>

</div>


</main>

</div>



<script>


const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const welcome =
    document.getElementById("welcome");

const chatList =
    document.getElementById("chatList");


let conversation = [];



/* SEND WITH ENTER */

input.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
            &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendMessage();

        }

    }
);



/* SEND BUTTON */

send.addEventListener(
    "click",
    sendMessage
);



/* AUTO RESIZE */

input.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                180
            ) + "px";

    }
);



/* ADD MESSAGE */

function addMessage(
    role,
    text
){

    if(welcome){

        welcome.style.display =
            "none";

    }


    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar " +
        (
            role === "user"
            ?
            "user-avatar"
            :
            "ai-avatar"
        );


    avatar.textContent =
        role === "user"
        ?
        "YOU"
        :
        "E";


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";


    body.textContent =
        text;


    message.appendChild(
        avatar
    );

    message.appendChild(
        body
    );


    if(role === "assistant"){

        const copy =
            document.createElement(
                "button"
            );

        copy.className =
            "copy-btn";

        copy.textContent =
            "Copy";

        copy.onclick =
            function(){

                navigator.clipboard
                    .writeText(text);

                copy.textContent =
                    "Copied!";

                setTimeout(
                    () => {
                        copy.textContent =
                            "Copy";
                    },
                    1500
                );

            };


        body.appendChild(
            copy
        );

    }


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    return body;

}



/* TYPING */

function showTyping(){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message";

    message.id =
        "typingMessage";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar ai-avatar";

    avatar.textContent =
        "E";


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";


    body.innerHTML = `

        <div class="typing">

            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>

        </div>

    `;


    message.appendChild(
        avatar
    );

    message.appendChild(
        body
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}



/* REMOVE TYPING */

function removeTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if(typing){

        typing.remove();

    }

}



/* SIMPLE DEMO AI */

function generateAnswer(
    question
){

    const q =
        question.toLowerCase();


    if(
        q.includes("hello")
        ||
        q.includes("hi")
        ||
        q.includes("hey")
    ){

        return "Hey! 👋 I'm ERICK AI. How can I help you?";

    }


    if(
        q.includes("who are you")
        ||
        q.includes("what are you")
    ){

        return "I'm ERICK AI, a personal AI assistant created as a GitHub project.";

    }


    if(
        q.includes("your name")
    ){

        return "My name is ERICK AI. 🤖";

    }


    if(
        q.includes("c++")
    ){

        return "C++ is a powerful programming language used for software, games, systems programming and much more.";

    }


    if(
        q.includes("html")
    ){

        return "HTML is the structure of a website. CSS controls its appearance, while JavaScript adds behavior and interaction.";

    }


    if(
        q.includes("javascript")
        ||
        q.includes("js")
    ){

        return "JavaScript is a programming language commonly used to make websites interactive and dynamic.";

    }


    if(
        q.includes("github")
    ){

        return "GitHub is a platform where developers store, manage and collaborate on code. You can also use GitHub Pages to publish websites.";

    }


    if(
        q.includes("thank")
    ){

        return "You're welcome! 😎";

    }


    if(
        q.includes("bye")
    ){

        return "See you later! 👋";

    }


    return "I'm currently running in GitHub-only demo mode. I can answer a small set of built-in questions, but a real AI model needs to be connected to this interface.";

}



/* SEND MESSAGE */

async function sendMessage(){

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value = "";

    input.style.height =
        "auto";


    addMessage(
        "user",
        text
    );


    conversation.push({

        role:"user",

        content:text

    });


    send.disabled =
        true;


    showTyping();


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                700
            )
    );


    removeTyping();


    const answer =
        generateAnswer(
            text
        );


    addMessage(
        "assistant",
        answer
    );


    conversation.push({

        role:"assistant",

        content:answer

    });


    saveChat();


    send.disabled =
        false;


    input.focus();

}



/* SAVE */

function saveChat(){

    localStorage.setItem(
        "erick_conversation",
        JSON.stringify(
            conversation
        )
    );

}



/* LOAD */

function loadChat(){

    const saved =
        localStorage.getItem(
            "erick_conversation"
        );


    if(!saved){

        return;

    }


    try{

        conversation =
            JSON.parse(
                saved
            );


        conversation.forEach(
            message => {

                addMessage(
                    message.role,
                    message.content
                );

            }
        );

    }
    catch{

        conversation = [];

    }

}



/* NEW CHAT */

function newChat(){

    conversation = [];


    localStorage.removeItem(
        "erick_conversation"
    );


    location.reload();

}



/* START */

loadChat();


input.focus();


</script>

</body>
</html>
